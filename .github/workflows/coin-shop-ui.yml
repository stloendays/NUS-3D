name: Coin shop UI compatibility
on:
  push:
    branches: ["feature/ui-shop-wallet-polish-*"]
  pull_request:
    paths:
      - "godot/scripts/utown_coins.gd"
      - "godot/tests/coin_shop_ui_smoke_test.gd"
      - "godot/tests/coins_smoke_test.gd"
      - ".github/workflows/coin-shop-ui.yml"

jobs:
  shop-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path godot --import --quit
      - name: Check shop and wallet layout hooks
        run: godot --headless --path godot --script res://tests/coin_shop_ui_smoke_test.gd
      - name: Regress coin purchases and account-independent save
        run: godot --headless --path godot --script res://tests/coins_smoke_test.gd
      - name: Check shared minimalist HUD contract
        run: godot --headless --path godot --script res://tests/ui_feedback_smoke_test.gd
