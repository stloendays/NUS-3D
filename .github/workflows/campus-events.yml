name: M28 scheduled campus events

on:
  push:
    branches:
      - feature/m28-scheduled-campus-events-20261127
    paths:
      - ".github/workflows/campus-events.yml"
      - "godot/scenes/main.tscn"
      - "godot/scripts/campus_event_director.gd"
      - "godot/scripts/hud.gd"
      - "godot/scripts/utown_coins.gd"
      - "godot/tests/campus_events_smoke_test.gd"
      - "godot/tests/render_campus_events.gd"
      - "docs/M28_CAMPUS_EVENTS.md"
  pull_request:
    paths:
      - ".github/workflows/campus-events.yml"
      - "godot/scenes/main.tscn"
      - "godot/scripts/campus_event_director.gd"
      - "godot/scripts/hud.gd"
      - "godot/scripts/utown_coins.gd"
      - "godot/tests/campus_events_smoke_test.gd"
      - "godot/tests/render_campus_events.gd"
      - "docs/M28_CAMPUS_EVENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campus-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project assets and scripts
        run: godot --headless --path godot --import --quit
      - name: Validate scheduled events, player interaction and account rewards
        run: timeout 75s godot --headless --path godot --script res://tests/campus_events_smoke_test.gd
      - name: Install virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
      - name: Render actual campus event HUD states
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot --audio-driver Dummy --rendering-driver opengl3 --script res://tests/render_campus_events.gd
      - name: Upload M28 visual review
        uses: actions/upload-artifact@v4
        with:
          name: nus3d-m28-campus-events
          path: |
            godot/review_previews/M28_LUNCH_EVENT.png
            godot/review_previews/M28_RAIN_EVENT.png
            godot/review_previews/M28_EVENING_EVENT.png
          if-no-files-found: error
          retention-days: 30
