name: M11 selected NPC friendship and account isolation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "godot/scripts/npc_relationships.gd"
      - "godot/scripts/utown_campus_life.gd"
      - "godot/scripts/utown_indoor_npcs.gd"
      - "godot/scripts/game_shell.gd"
      - "godot/scripts/account_store.gd"
      - "godot/tests/npc_relationship_smoke_test.gd"
      - ".github/workflows/npc_relationships.yml"

jobs:
  selected-npc-affinity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project and GDScript resources
        run: godot --headless --path godot --import --quit
      - name: Test selective personalities, save isolation, cooldown and tiers
        run: godot --headless --path godot --script res://tests/npc_relationship_smoke_test.gd
      - name: Test original integrated NPC / mission event controls
        run: godot --headless --path godot --script res://tests/integration_smoke_test.gd
