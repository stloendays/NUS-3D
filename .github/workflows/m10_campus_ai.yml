name: M10 Campus AI and external links

on:
  push:
    branches:
      - feature/m10-campus-ai-api-links-20261119
  pull_request:
    paths:
      - godot/data/campus_links.json
      - godot/scripts/campus_ai_panel.gd
      - godot/scripts/campus_hub.gd
      - godot/scripts/game_shell.gd
      - godot/tests/campus_ai_smoke_test.gd
      - tools/campus_ai_bridge.py
      - tools/test_campus_ai_bridge.py
      - docs/M10_CAMPUS_AI.md
      - .github/workflows/m10_campus_ai.yml

permissions:
  contents: read

jobs:
  local-bridge:
    name: Offline provider and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and offline unit tests
        run: |
          python -m py_compile tools/campus_ai_bridge.py tools/test_campus_ai_bridge.py
          python -m json.tool godot/data/campus_links.json > /dev/null
          python -m unittest tools.test_campus_ai_bridge -v
  godot-panel:
    name: Godot links and account-isolation smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Headless import / script validation
        run: godot --headless --path godot --import --quit
      - name: Verify optional hub, offline demo, pause and logout
        run: timeout 70s godot --headless --path godot --script res://tests/campus_ai_smoke_test.gd
