name: Godot 4 greybox smoke test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate UTown source data
        run: python tools/validate_utown_data.py
      - name: Audit conceptual pedestrian route clearance
        run: python tools/audit_route_clearance.py --strict --report build/route-clearance.json
      - name: Validate frozen public OSM boundary data
        run: python tools/validate_osm_reference.py
      - name: Report conceptual route vs OSM plan-view overlaps
        run: python tools/audit_osm_route.py
      - name: Quantify P0 OSM vs estimated model footprint fit
        run: python tools/audit_osm_proxy_fit.py --out build/osm-proxy-fit.json
      - name: Draw OSM versus model quantitative scorecards
        run: python tools/render_osm_proxy_fit.py --out build/utown-p0-fit-scorecard.svg
      - name: Create OSM vs estimated building overview
        run: python tools/render_utown_plan.py --osm godot/data/osm_p0_reference.json --out build/utown-osm-comparison.svg
      - name: Render original schematic top-down plan
        run: python tools/render_utown_plan.py --out build/utown-audit-plan.svg
      - name: Upload route audit report
        uses: actions/upload-artifact@v4
        with:
          name: utown-route-clearance-audit
          path: |
            build/route-clearance.json
            build/utown-audit-plan.svg
            build/utown-osm-comparison.svg
            build/osm-route-overlap.json
            build/osm-proxy-fit.json
            build/utown-p0-fit-scorecard.svg
          if-no-files-found: error
      - name: Validate M2 architecture profile assumptions
        run: python tools/validate_m2_profiles.py
      - name: Verify Blender authoring script syntax
        run: python -m py_compile blender/build_m2_blockouts.py
      - name: Run Python validator tests
        run: python -m unittest discover -s tools -t . -v
      - name: Validate sourced camera viewpoints
        run: python tools/validate_viewpoints.py
      - name: Validate original four-stop discovery data
        run: python tools/validate_discovery_tour.py
      - name: Validate fictional coursework options and mission stages
        run: python tools/validate_coursework_data.py
      - name: Validate English major exam data, original questions and scoring
        run: python tools/validate_english_exams.py
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project headlessly
        run: godot --headless --path godot --import --quit
      - name: Validate scene and geometry
        run: godot --headless --path godot --script res://tests/smoke_test.gd
      - name: Check English exam UI, grading, reward ledger and 13-faculty isolation
        run: godot --headless --path godot --script res://tests/english_exams_smoke_test.gd -- --nus3d-self-test
      - name: Render own-model viewpoint screenshots in Linux Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 fonts-noto-cjk
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot --rendering-driver opengl3 --script res://tests/render_viewpoints.gd
      - name: Publish provisional M1/M2 and M3 gameplay screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nus3d-visual-review-and-m3-showcase
          path: godot/review_previews/
          if-no-files-found: error
      - name: Run the main scene for 40 frames
        run: godot --headless --path godot --quit-after 40
