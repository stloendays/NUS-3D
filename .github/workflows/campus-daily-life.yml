name: M27 dynamic campus ecology

on:
  push:
    branches:
      - feature/m27-dynamic-campus-ecology-20261124
    paths:
      - ".github/workflows/campus-daily-life.yml"
      - "godot/scripts/campus_daily_life.gd"
      - "godot/scripts/campus_ambient_activities.gd"
      - "godot/scripts/hud.gd"
      - "godot/scenes/main.tscn"
      - "godot/tests/campus_daily_life_smoke_test.gd"
      - "godot/tests/render_campus_daily_life.gd"
  pull_request:
    paths:
      - ".github/workflows/campus-daily-life.yml"
      - "godot/scripts/campus_daily_life.gd"
      - "godot/scripts/campus_ambient_activities.gd"
      - "godot/scripts/hud.gd"
      - "godot/scenes/main.tscn"
      - "godot/tests/campus_daily_life_smoke_test.gd"
      - "godot/tests/render_campus_daily_life.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-life:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project assets and scripts
        run: godot --headless --path godot --import --quit
      - name: Validate time, lunch, personality, rain shelter and facility occupancy
        run: timeout 75s godot --headless --path godot --script res://tests/campus_daily_life_smoke_test.gd
      - name: Install virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          fi
      - name: Render real campus crowd and weather routines
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot --rendering-driver opengl3 --script res://tests/render_campus_daily_life.gd
      - name: Upload M27 visual review
        uses: actions/upload-artifact@v4
        with:
          name: nus3d-m27-dynamic-campus-ecology
          path: |
            godot/review_previews/M27_LUNCH_CROWD.png
            godot/review_previews/M27_RAIN_SHELTER.png
            godot/review_previews/M27_EVENING_CAMPUS.png
          if-no-files-found: error
          retention-days: 30
