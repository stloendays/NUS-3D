name: M4.3 Kent Ridge bus integration smoke

on:
  push:
    branches: ["feature/m4-3-kent-ridge-bus-expansion-20261119"]
  pull_request:
    paths:
      - "godot/data/kent_ridge_expansion.json"
      - "godot/scripts/kent_ridge_world.gd"
      - "godot/scripts/kent_ridge_bus.gd"
      - "godot/scripts/minimap.gd"
      - "godot/scenes/main.tscn"
      - "godot/tests/kent_ridge_expansion_smoke_test.gd"

jobs:
  kent-ridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import expanded game scene and scripts
        run: godot --headless --path godot --import --quit
      - name: Bus boarding, district geometry, minimap and player control checks
        run: timeout 80s godot --headless --path godot --script res://tests/kent_ridge_expansion_smoke_test.gd
      - name: Launch scene for 40 rendered-independent frames
        run: timeout 80s godot --headless --path godot --quit-after 40
