name: Cartoon account UI preview (Godot-rendered)

on:
  pull_request:
    paths:
      - "godot/scripts/game_shell.gd"
      - "godot/scripts/campus_cartoon_skin.gd"
      - "godot/scripts/campus_login_art.gd"
      - "godot/data/language_catalog.json"
      - "godot/tests/cartoon_shell_smoke_test.gd"
      - "godot/tests/render_cartoon_login.gd"
      - ".github/workflows/cartoon_ui_preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Install software display and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 fonts-noto-cjk
      - name: Import project assets and scripts
        run: godot --headless --path godot --import --quit
      - name: Validate offline login shell without player saves
        run: godot --headless --path godot --script res://tests/cartoon_shell_smoke_test.gd
      - name: Render English login, Chinese login, and real local mailbox
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot --rendering-driver opengl3 --script res://tests/render_cartoon_login.gd
      - name: Upload genuine Godot viewport captures
        uses: actions/upload-artifact@v4
        with:
          name: nus3d-m5-cartoon-ui-screens
          path: |
            godot/review_previews/M5_2_CARTOON_LOGIN_EN.png
            godot/review_previews/M5_2_CARTOON_LOGIN_ZH.png
            godot/review_previews/M5_2_CARTOON_MAIL.png
          if-no-files-found: error
          retention-days: 30
