name: M25 campus props smoke

on:
  push:
    branches:
      - feature/m25-campus-scattered-props-20261120
    paths:
      - ".github/workflows/campus-props-smoke.yml"
      - "godot/scripts/campus_scattered_props.gd"
      - "godot/scripts/utown_map_dressing.gd"
      - "godot/tests/campus_scattered_props_smoke_test.gd"
      - "godot/tests/map_facelift_smoke_test.gd"
      - "godot/tests/render_campus_props_review.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campus-props:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fLsS --retry 4 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project assets and scripts
        run: godot --headless --path godot --import --quit
      - name: Validate seeded campus scatter, furniture and collision-free placement
        run: timeout 65s godot --headless --path godot --script res://tests/campus_scattered_props_smoke_test.gd
      - name: Validate existing UTown and Kent Ridge map dressing budgets
        run: timeout 65s godot --headless --path godot --script res://tests/map_facelift_smoke_test.gd
      - name: Install virtual display for visual review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Render real Godot campus prop close-ups
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot --rendering-driver opengl3 --script res://tests/render_campus_props_review.gd
      - name: Upload campus prop visual review
        uses: actions/upload-artifact@v4
        with:
          name: nus3d-m25-campus-props-visual-review
          path: |
            godot/review_previews/M25_VENDING_MACHINE.png
            godot/review_previews/M25_SHADED_PICNIC.png
            godot/review_previews/M25_WATER_REFILL.png
          if-no-files-found: error
          retention-days: 30
